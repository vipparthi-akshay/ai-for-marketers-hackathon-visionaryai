<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#grad1)"/>
  <!-- Rocket body -->
  <path d="M100 45 L120 85 L115 110 L100 120 L85 110 L80 85 Z" fill="white" filter="url(#glow)"/>
  <!-- Rocket window -->
  <circle cx="100" cy="78" r="8" fill="url(#grad1)"/>
  <!-- Rocket flame left -->
  <path d="M88 115 L80 140 L92 130 L100 145 L100 120 Z" fill="#fbbf24" opacity="0.9"/>
  <!-- Rocket flame right -->
  <path d="M112 115 L120 140 L108 130 L100 145 L100 120 Z" fill="#f97316" opacity="0.9"/>
  <!-- Signal waves -->
  <path d="M130 60 Q145 70 130 85" stroke="white" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M140 50 Q162 70 140 95" stroke="white" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="50" cy="55" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="155" cy="120" r="2" fill="white" opacity="0.5"/>
  <circle cx="45" cy="130" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="150" cy="50" r="1.5" fill="white" opacity="0.6"/>
</svg>