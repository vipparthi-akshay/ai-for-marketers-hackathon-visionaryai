services:
  - type: web
    name: marketpilot-api
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: marketpilot-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://marketpilot-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /health

  - type: redis
    name: marketpilot-redis
    plan: free

databases:
  - name: marketpilot-db
    plan: free
